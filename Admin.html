<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin – Post Event</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", sans-serif;
      background: #eef3f5;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #008d8c;
      color: white;
      padding: 16px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header a {
      color: white;
      text-decoration: none;
      background: rgba(255,255,255,0.2);
      padding: 6px 12px;
      border-radius: 8px;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    form {
      background: white;
      padding: 30px;
      width: 100%;
      max-width: 420px;
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    h2 {
      text-align: center;
      color: #008d8c;
      margin-bottom: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .status {
      margin-top: 15px;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #e6f7ea;
      color: #1f8a3f;
    }

    .error {
      background: #ffe6e6;
      color: #c21b1b;
    }
    .event-card {

display:flex;
gap:20px;
background:white;
padding:20px;
margin-bottom:20px;
border-radius:14px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);

}

.media-box img,
.media-box video {

width:180px;
height:140px;
object-fit:cover;
border-radius:10px;

}

.info-box {

flex:1;

}

.actions {

margin-top:10px;

}

.actions button {

padding:8px 16px;
margin-right:10px;
border:none;
border-radius:8px;
cursor:pointer;
background:#2563eb;
color:white;

}

.actions .danger {

background:#dc2626;

}
.modal {

position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);

display:none;
justify-content:center;
align-items:center;

}

.modal.show {

display:flex;

animation:fadeIn .25s ease;

}

.modal-box {

background:white;
padding:30px;
border-radius:18px;
width:95%;
max-width:500px;

animation:slideUp .25s ease;

}

.modal-actions {

display:flex;
gap:10px;

margin-top:15px;

}

.modal-actions button {

flex:1;
padding:12px;
border:none;
border-radius:10px;

}

.cancel {

background:#ddd;

}

#previewBox img,
#previewBox video {

width:100%;
margin-top:15px;
border-radius:12px;

}

.event-card {

display:flex;
gap:20px;
padding:20px;
background:white;
border-radius:14px;

margin-bottom:20px;

transition:.3s ease;

}

.event-card.removing {

opacity:0;
transform:translateX(80px);

}

.media-box img,
.media-box video {

width:200px;
height:140px;

object-fit:cover;

border-radius:10px;

}

@keyframes slideUp {

from {

transform:translateY(40px);
opacity:0;

}

to {

transform:translateY(0);
opacity:1;

}

}

@keyframes fadeIn {

from {

opacity:0;

}
to {
opacity:1;
}
}
.danger{
background:#dc2626;
}
/* Responsive Design */
@media(max-width:768px){

.event-card{

flex-direction:column;
}
.media-box img,
.media-box video{
width:100%;

}

}
  </style>
</head>

<body>

<header>
  <strong>Admin Panel</strong>
  <a href="index.html">← Back to Home</a>
</header>

<main>
  <form id="eventForm">
    <h2>Post New Event</h2>

    <input type="text" id="title" placeholder="Event Title" required />
    <textarea id="desc" placeholder="Description (optional)"></textarea>
   <input type="file" id="media" accept="image/*,video/*" required/>


    <button type="submit">Post Event</button>
    <div id="status" class="status"></div>
  </form>
</main>
<!-- ADD THIS BELOW YOUR FORM -->

<section style="padding:20px; max-width:900px; margin:auto;">
  <h2>Manage Events</h2>

  <div id="eventList"></div>
</section>

<!-- Event Modal -->
 <!-- EDIT MODAL -->

<div id="editModal" class="modal">

<div class="modal-box">

<h2>Edit Event</h2>

<input id="editTitle" placeholder="Title">

<textarea id="editDesc"
placeholder="Description"></textarea>

<input id="editMedia"
type="file"
accept="image/*,video/*">

<div id="previewBox"></div>

<div class="modal-actions">

<button id="saveEdit">
Save Changes
</button>

<button onclick="closeModal()"
class="cancel">
Cancel
</button>
</div>
</div>
</div>

<script type="module">

import { supabase } from "./supabase.js";

const form = document.getElementById("eventForm");
const eventList = document.getElementById("eventList");

const modal = document.getElementById("editModal");

const editTitle =
document.getElementById("editTitle");

const editDesc =
document.getElementById("editDesc");

const editMedia =
document.getElementById("editMedia");

const previewBox =
document.getElementById("previewBox");

const saveEdit =
document.getElementById("saveEdit");

let editingId = null;

loadEvents();

/* ================= CREATE EVENT ================= */

form.addEventListener("submit", async e => {

e.preventDefault();

const title =
document.getElementById("title").value;

const desc =
document.getElementById("desc").value;

const file =
document.getElementById("media").files[0];

if(!file) return alert("Media required");

const name =
Date.now()+"-"+file.name;

await supabase.storage
.from("events")
.upload(name,file);

const {data} =
supabase.storage
.from("events")
.getPublicUrl(name);

await supabase
.from("events")
.insert([{

title,
description:desc,
media_url:data.publicUrl,
media_type:file.type
.startsWith("video")
? "video":"image"

}]);

form.reset();

loadEvents();

});
function detectMedia(event){

if(!event.media_url) return "";

if(event.media_type === "image")
return `<img src="${event.media_url}" loading="lazy">`;

if(event.media_type === "video")
return `<video src="${event.media_url}" controls></video>`;

/* fallback auto-detect */

const url = event.media_url.toLowerCase();

if(url.match(/\.(jpg|jpeg|png|gif|webp)$/))
return `<img src="${event.media_url}" loading="lazy">`;

return `<video src="${event.media_url}" controls></video>`;

}
/* ================= LOAD EVENTS ================= */

async function loadEvents(){

const { data, error } =
await supabase
.from("events")
.select("*");

if(error){

console.error("Fetch error:", error.message);
alert("Failed to fetch events");

return;

}

if(!data || data.length === 0){

eventList.innerHTML =
"<p>No events found yet.</p>";

return;

}

eventList.innerHTML =
data.map(event => `

<div class="event-card"
id="event-${event.id}">

<div class="media-box">

${detectMedia(event)}

</div>

<div>

<h3>${event.title}</h3>

<p>${event.description || ""}</p>

<button onclick="openEdit('${event.id}')">
Edit
</button>

<button onclick="deleteEvent('${event.id}')"
class="danger">
Delete
</button>

</div>

</div>

`).join("");

}

/* ================= DELETE EVENT ================= */

window.deleteEvent = async id=>{

if(!confirm("Delete event permanently?"))
return;

const card =
document.getElementById("event-"+id);

card.classList.add("removing");

setTimeout(async()=>{

await supabase
.from("events")
.delete()
.eq("id",id);

card.remove();

},300);

};

/* ================= OPEN MODAL ================= */

window.openEdit = async id=>{

editingId=id;

const {data}=await supabase
.from("events")
.select("*")
.eq("id",id)
.single();

editTitle.value=data.title;

editDesc.value=data.description;

previewBox.innerHTML=
data.media_type==="image"

? `<img src="${data.media_url}">`

: `<video src="${data.media_url}" controls></video>`;

modal.classList.add("show");

};

/* ================= CLOSE MODAL ================= */

window.closeModal=()=>{

modal.classList.remove("show");

};

/* ================= PREVIEW BEFORE SAVE ================= */

editMedia.addEventListener("change",e=>{

const file=e.target.files[0];

if(!file) return;

previewBox.innerHTML=

file.type.startsWith("video")

? `<video src="${URL.createObjectURL(file)}" controls></video>`

: `<img src="${URL.createObjectURL(file)}">`;

});

/* ================= SAVE EDIT ================= */

saveEdit.onclick=async()=>{

let media_url=null;

let media_type=null;

const file=editMedia.files[0];

if(file){

const name=
Date.now()+"-"+file.name;

await supabase.storage
.from("events")
.upload(name,file);

const {data}=
supabase.storage
.from("events")
.getPublicUrl(name);

media_url=data.publicUrl;

media_type=
file.type.startsWith("video")
? "video":"image";

}

await supabase
.from("events")
.update({

title:editTitle.value,
description:editDesc.value,

...(media_url && {
media_url,
media_type
})

})
.eq("id",editingId);

closeModal();

loadEvents();

};

</script>

</body>
</html>
